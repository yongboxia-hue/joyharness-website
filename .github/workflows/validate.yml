name: Validate site

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}
  # The installer is published elsewhere now, so a release no longer touches
  # this repository -- and audit:release, which is what proves the download the
  # site links to is the current release, stopped having anything to trigger it.
  # Everything it guards fails silently and from the outside: an object deleted
  # or overwritten by hand, the bucket flipped back to private, the storage plan
  # expired, the account in arrears. The download 404s and nothing here notices.
  #
  # Weekly rather than daily because publishing already verifies the bytes it
  # uploaded by reading them back; this is the drift canary, not the primary
  # check, and each run pulls the package to hash it.
  schedule:
    - cron: "17 3 * * 1"

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci --no-audit --no-fund

      # 两个脚本都驱动真实浏览器。服务它们自己会起，浏览器得装。
      - run: npx playwright install --with-deps chromium

      # 脚本自带本地服务，这里不用再起一个
      - name: Validate
        run: npm run validate

      - name: Release audit
        run: npm run audit:release

      - name: Keep the screenshots from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-screenshots
          path: validation/
